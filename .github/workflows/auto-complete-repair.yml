name: RHNS Verification Pipeline

on:
  workflow_run:
    workflows: ['CI/CD Pipeline']
    types: [completed]
  workflow_dispatch:

# This workflow is deliberately read-only. It must never edit source or create
# branches/PRs automatically. A failed verification remains a visible failure.
permissions:
  contents: read

jobs:
  verify:
    name: Verify without modifying source
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install locked dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is required for reproducible verification"
            exit 1
          fi
          npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Run lint
        run: npm run lint

      - name: Syntax-check RHNS runtime and tests
        run: |
          for file in \
            agents/core/supabase-rhns-store.js \
            agents/core/approval-gate.js \
            agents/core/contracts.js \
            agents/core/mcp-coordinator.js \
            agents/planning/proposal-agent.js \
            agents/planning/index.js \
            agents/index.js \
            agents/startup.js \
            agents/orchestration/rewoo-executor.js \
            tests/supabase-rhns-store.test.js \
            tests/startup-durable-storage.test.js \
            tests/proposal-agent.test.js \
            tests/rewoo-executor.test.js; do
            node --check "$file" || exit 1
          done
