name: CI Notify Dispatch
on:
  workflow_run:
    workflows: ["Garcar Deploy Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  notify:
    uses: ./.github/workflows/event-spine-dispatch.yml
    with:
      event_type: github.ci_${{ github.event.workflow_run.conclusion }}
      status: ${{ github.event.workflow_run.conclusion }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
      branch: ${{ github.event.workflow_run.head_branch }}
      commit_sha: ${{ github.event.workflow_run.head_sha }}
      actor: ${{ github.event.workflow_run.triggering_actor.login }}
      payload_json: >-
        {"event":"workflow_run","workflow":"${{ github.event.workflow_run.name }}","run_id":"${{ github.event.workflow_run.id }}","conclusion":"${{ github.event.workflow_run.conclusion }}","trigger":"${{ github.event.workflow_run.event }}"}
    secrets:
      dispatch_url: ${{ secrets.DISPATCH_URL }}
      dispatch_secret: ${{ secrets.DISPATCH_SECRET }}
