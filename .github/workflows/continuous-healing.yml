name: Continuous Health Verification

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate health-gate behavior
        run: bash tests/health-check-gate.sh

      - name: Verify configured live health endpoints
        env:
          GARCAR_HEALTH_URLS: ${{ vars.GARCAR_HEALTH_URLS }}
        run: bash scripts/verify-autonomous-health.sh
