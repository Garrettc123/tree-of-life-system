name: Garcar Native Control Plane Checks

on:
  pull_request:
    paths:
      - "garcar-native-control-plane/**"
      - ".github/workflows/garcar-native-control-plane.yml"
  push:
    branches: [main]
    paths:
      - "garcar-native-control-plane/**"
      - ".github/workflows/garcar-native-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garcar-native-control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garcar-native-control-plane/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
