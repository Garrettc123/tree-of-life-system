name: Garcar Native Control Plane Checks

on:
  pull_request:
    paths:
      - "garcar-native-control-plane/**"
      - "orchestrator/**"
      - ".github/workflows/garcar-native-control-plane.yml"
  push:
    branches: [main]
    paths:
      - "garcar-native-control-plane/**"
      - "orchestrator/**"
      - ".github/workflows/garcar-native-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garcar-native-control-plane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: garcar-native-control-plane
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garcar-native-control-plane/requirements-dev.txt

      - name: Install pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py ops/backup_db.py

      - name: Validate local shell scripts
        run: |
          for script in ops/*.sh; do
            bash -n "$script"
          done

      - name: Run control-plane tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Validate backup utility CLI
        run: python ops/backup_db.py --help

      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garcar-native-control-plane-test-report
          path: garcar-native-control-plane/test-results.xml
          if-no-files-found: ignore

  orchestrator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install orchestrator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==9.2.0

      - name: Compile Python sources
        run: python -m compileall -q main.py router.py supabase_log.py test_main.py backup_db.py

      - name: Run orchestrator tests
        run: python -m pytest -q test_main.py --junitxml=test-results-orchestrator.xml

      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garcar-orchestrator-test-report
          path: orchestrator/test-results-orchestrator.xml
          if-no-files-found: ignore

  compose-smoke-test:
    needs: [control-plane-tests, orchestrator-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: garcar-native-control-plane
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate isolated local test secrets
        run: bash ops/init_local_env.sh

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build and start the complete local stack
        run: docker compose up --build -d

      - name: Verify both services, database, and audit chain
        env:
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/health
          REQUIRE_ORCHESTRATOR=1 bash ops/verify_local.sh

      - name: Show container status on failure
        if: failure()
        run: docker compose ps

      - name: Stop and remove ephemeral CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans
