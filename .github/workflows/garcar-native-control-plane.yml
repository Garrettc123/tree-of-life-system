name: Garcar Native Control Plane Checks

on:
  pull_request:
    paths:
      - "garcar-native-control-plane/**"
      - ".github/workflows/garcar-native-control-plane.yml"
  push:
    branches: [main]
    paths:
      - "garcar-native-control-plane/**"
      - ".github/workflows/garcar-native-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garcar-native-control-plane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: garcar-native-control-plane
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garcar-native-control-plane/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py ops/backup_db.py

      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Validate backup utility CLI
        run: python ops/backup_db.py --help

      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garcar-native-control-plane-test-report
          path: garcar-native-control-plane/test-results.xml
          if-no-files-found: ignore
