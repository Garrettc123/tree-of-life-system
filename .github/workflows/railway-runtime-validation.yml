name: Railway Runtime Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'Procfile'
      - 'agents/startup.js'
      - 'agents/health-server.js'
      - 'orchestrator/**'
      - 'scripts/garcar-health-canary.js'
      - 'tests/garcar-health-canary.node-test.cjs'
      - 'Dockerfile'
      - '.github/workflows/railway-runtime-validation.yml'
  push:
    branches: [main]
    paths:
      - 'Procfile'
      - 'agents/startup.js'
      - 'agents/health-server.js'
      - 'orchestrator/**'
      - 'scripts/garcar-health-canary.js'
      - 'tests/garcar-health-canary.node-test.cjs'
      - 'Dockerfile'
      - '.github/workflows/railway-runtime-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Railway runtime and canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install and validate Python web runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r orchestrator/requirements.txt
          python -m compileall -q orchestrator
          python -c "import sys; sys.path.insert(0, 'orchestrator'); from main import app; assert app"
      - name: Syntax-check Node runtime and canary
        run: |
          node --check agents/startup.js
          node --check agents/health-server.js
          node --check scripts/garcar-health-canary.js
          test -d scripts
      - name: Test read-only health canary
        run: node --test tests/garcar-health-canary.node-test.cjs
      - name: Build production container
        run: docker build --tag tree-of-life-runtime-validation .
