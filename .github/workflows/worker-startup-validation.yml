name: Worker startup canary

on:
  pull_request:
    paths:
      - 'agents/**'
      - 'proto/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/worker-startup-validation.yml'

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test -- --runInBand
        env:
          RHNS_DURABLE_STORE_ENABLED: 'false'
